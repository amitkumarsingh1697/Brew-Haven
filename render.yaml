# Render blueprint for the demo API (ADR-0002). Database is Neon: set DATABASE_URL in the dashboard.
services:
  - type: web
    name: brew-haven-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @brew-haven/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: STAFF_TOKEN_SECRET
        generateValue: true
      - key: SIMULATED_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: CORS_ORIGINS
        sync: false
