# Render blueprint for the demo API (ADR-0002). Database is Neon: set DATABASE_URL in the dashboard.
services:
  - type: web
    name: brew-haven-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @brew-haven/api start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: STAFF_TOKEN_SECRET
        generateValue: true
      - key: SIMULATED_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: CORS_ORIGINS
        sync: false
      # Customer messages: "log" previews them in the owner's Setup > Customer messages; "meta" sends via WhatsApp Cloud API.
      - key: NOTIFY_PROVIDER
        value: log
      - key: CUSTOMER_APP_URL
        sync: false
      # Operational alerts (server errors, background jobs that gave up): a Slack / Google Chat / Discord webhook URL.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: APP_ENV
        value: demo
      # Self-serve sign-up at /signup on the staff app. Off in production unless set to "true".
      - key: SIGNUP_ENABLED
        value: "true"
